spring:
  ai:
    model:
      # Keep the OpenAI client off for the no-key stub profile. Set to `openai` for a real run.
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: ${OPENAI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
          max-tokens: 2000
    retry:
      max-attempts: 1

speclitmus:
  ai:
    mode: ${APP_AI_MODE:stub}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  test:
    scenario: ${APP_TEST_SCENARIO:review-valid}
